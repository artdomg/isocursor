<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IsoCity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b1020;
      }
      #game {
        width: 100%;
        height: 100%;
        display: block;
      }
      #hud {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 5;
        pointer-events: none;
        font-family: "Press Start 2P", monospace;
        font-size: 10px;
        line-height: 1.8;
        color: #f4efe4;
        text-shadow:
          2px 0 #161014,
          -2px 0 #161014,
          0 2px #161014,
          0 -2px #161014;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">ISOCITY 3D</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
